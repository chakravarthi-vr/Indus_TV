name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # Signs every build with the SAME key so new versions can update old installs
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/indus.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/indus.jks" >> "$GITHUB_ENV"
          else
            echo "::error::KEYSTORE_BASE64 secret is missing. Without it every build gets a different signature and cannot update the installed app. See README > Signing."
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        run: gradle assembleRelease --no-daemon

      - name: Name APK with version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="$GITHUB_REF_NAME"; else VER="dev-$GITHUB_RUN_NUMBER"; fi
          mv app/build/outputs/apk/release/*.apk "IndusTV-$VER.apk"
          echo "APK_NAME=IndusTV-$VER.apk" >> "$GITHUB_ENV"

      # Shows the signing fingerprint: it must be identical for every release
      - name: Show signing fingerprint
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK_NAME" | grep -i "SHA-256" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: IndusTV-apk
          path: ${{ env.APK_NAME }}

      # Only runs when you push a tag like v1.0
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
