plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.iptv.industv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.iptv.industv'
        minSdk 21
        targetSdk 34
        // Every build gets a higher versionCode so updates install over old versions
        // minutes since 1970: always increases, so a newer build can always update an older one
        versionCode System.currentTimeMillis().intdiv(60000) as int
        versionName(System.getenv("APP_VERSION") ?: "1.0")
    }
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Fixed release key when available (CI secrets), otherwise debug key for local builds
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'io.coil-kt:coil:2.5.0'
}
